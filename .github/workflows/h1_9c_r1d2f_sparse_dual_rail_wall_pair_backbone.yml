name: H1.9C-R1d2f Sparse Dual-Rail Wall-Pair Backbone

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: h1-9c-r1d2f-sparse-dual-rail-wall-pair
  cancel-in-progress: false

jobs:
  sparse-dual-rail-wall-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      R1C_ARTIFACT_ID: '9715841230'
      R1C_ARTIFACT_SHA256: '7f6c72b577469d7fcc65a92583a153da991e27e9f77950d3ceff49016b6acaa4'
      R1D2A_ARTIFACT_ID: '9718599568'
      R1D2A_ARTIFACT_SHA256: '5076d65b87101279aed5f53161293772b5ef6398d22024959eaf1ad6d9b9604d'
      EXPECT_CYBER: 'a09345cd4d195991d23a4a45c25969f2e562c72d7b556391f1eaed799a955da8'
      EXPECT_BENDS_RAR: '07d8ec04cb527887328ed63487e024609fa8395cc659a1fc43e29b54115adab1'
      EXPECT_CAVIGLIA_RAR: 'dcac91f20ea9001c927a6f6096a23be2b2a65108774b7b66abc6ed7ac9e3ee48'
      EXPECT_SHAFTS_RAR: '20cd6baca8c18876774e701ec3d37a6dd373b7e1d72e251687eb59da382a55d8'
      EXPECT_BENDS_DWG: '965063af493b10e42a9639ae3742abdf936f6cf951b39f83353bb0c859a7205c'
      EXPECT_CAVIGLIA_DWG: '6ce2f8795307889a13d8c5a4fbaeb181c18055e623a1a9b748f9d2150f6a0abd'
      EXPECT_SHAFTS_DWG: '48f4d0b05bd364cd9d987399a3e4189ea5a29ccbac6eb1986c35f10035ee6ad6'
      EXPECT_SOURCE_CONTRACT: '78b0b5b32928561c5efa2de3aa20babcaf4c9ec6428b7d2475633fe61c0f0362'
      EXPECT_SOURCE_PAGE_SHA: '334fc6f2fe24e0a925a4005168dfbdea6d121d23cb73d76d0f4f7ba892e6bd88'
      PARENT_R1D2E_ARTIFACT_SHA256: '7cd57445e17171551ce11575153c44907be3573d9f916d8bbc7797c723bad9e8'
      PARENT_R1D2E_AUDIT_PACKAGE_SHA256: '7ff749a45efad321929ab15e52c4820998438a48cfcbda98a8d07f8b38bb3836'
      BACKBONE_KERNEL_SHA256: '105e14e491b584fc3afd417b86c80ecf77acb1a46c6926476ca61f5d5bde9f1b'

    steps:
      - name: Prepare deterministic workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/r1c upstream/r1d2a work/cad work/dxf work/code report/glyphs report/diagnostics toolmeta
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip jq git build-essential autoconf automake libtool pkg-config libpcre2-dev libxml2-dev swig python3-dev gettext texinfo
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'ezdxf==1.4.4' 'Pillow==11.3.0' 'numpy==2.5.2'
          python3 - <<'PY' > toolmeta/python_tools.txt
          import sys, ezdxf, PIL, numpy
          print('python', sys.version)
          print('ezdxf', ezdxf.__version__)
          print('Pillow', PIL.__version__)
          print('numpy', numpy.__version__)
          PY

      - name: Download and verify frozen upstream artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"
          for spec in "${R1C_ARTIFACT_ID}:r1c" "${R1D2A_ARTIFACT_ID}:r1d2a"; do
            id="${spec%%:*}"; tag="${spec##*:}"
            curl --fail --location --silent --show-error               -H "Authorization: Bearer ${GH_TOKEN}"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "${api}/${id}/zip" -o "upstream/${tag}.zip"
          done

          echo "${R1C_ARTIFACT_SHA256}  upstream/r1c.zip" | sha256sum -c -
          echo "${R1D2A_ARTIFACT_SHA256}  upstream/r1d2a.zip" | sha256sum -c -
          unzip -q upstream/r1c.zip -d upstream/r1c
          unzip -q upstream/r1d2a.zip -d upstream/r1d2a

          check() {
            local f="$1" expected="$2" actual
            actual="$(sha256sum "$f" | awk '{print $1}')"
            printf '%s\t%s\t%s\n' "$f" "$actual" "$expected" >> report/frozen_identity.tsv
            test "$actual" = "$expected"
          }

          check upstream/r1c/raw/Cyberdrawings.rar "$EXPECT_CYBER"
          check upstream/r1c/raw/bends3d.rar "$EXPECT_BENDS_RAR"
          check upstream/r1c/raw/cavigliatunnel.rar "$EXPECT_CAVIGLIA_RAR"
          check upstream/r1c/raw/cheopsshafts.rar "$EXPECT_SHAFTS_RAR"
          check upstream/r1c/unpacked/bends3d/bends3d.dwg "$EXPECT_BENDS_DWG"
          check upstream/r1c/unpacked/cavigliatunnel/cavigliatunnel.dwg "$EXPECT_CAVIGLIA_DWG"
          check upstream/r1c/unpacked/cheopsshafts/cheopsshafts.dwg "$EXPECT_SHAFTS_DWG"
          check upstream/r1d2a/report/source_semantic_contract.json "$EXPECT_SOURCE_CONTRACT"
          check upstream/r1d2a/report/source_page_sha256.txt "$EXPECT_SOURCE_PAGE_SHA"

          cp upstream/r1c/unpacked/bends3d/bends3d.dwg work/cad/bends3d.dwg
          cp upstream/r1c/unpacked/cavigliatunnel/cavigliatunnel.dwg work/cad/cavigliatunnel.dwg
          cp upstream/r1c/unpacked/cheopsshafts/cheopsshafts.dwg work/cad/cheopsshafts.dwg
          cp upstream/r1d2a/report/source_semantic_contract.json report/source_semantic_contract.json
          cp upstream/r1d2a/report/source_page_sha256.txt report/source_page_sha256.txt

          python3 - <<'PY'
          import json
          d=json.load(open('report/source_semantic_contract.json',encoding='utf-8'))
          assert d.get('target_used') is False
          assert len(d['frozen_segment_semantics']) == 12
          assert all(all(v is True for v in group.values()) for group in d['source_checks'].values())
          print('FROZEN_SOURCE_SEMANTIC_GATE=PASS')
          PY

          cat > report/frozen_upstream_artifacts.json <<JSON
          {
            "r1c": {"artifact_id": ${R1C_ARTIFACT_ID}, "sha256": "${R1C_ARTIFACT_SHA256}"},
            "r1d2a": {"artifact_id": ${R1D2A_ARTIFACT_ID}, "sha256": "${R1D2A_ARTIFACT_SHA256}"},
            "parent_r1d2e_artifact_sha256": "${PARENT_R1D2E_ARTIFACT_SHA256}",
            "parent_r1d2e_audit_package_sha256": "${PARENT_R1D2E_AUDIT_PACKAGE_SHA256}",
            "new_romberg_acquisition": false,
            "new_isida_acquisition": false,
            "target_access": false
          }
          JSON
          rm -rf upstream/r1c upstream/r1d2a upstream/*.zip

      - name: Build pinned LibreDWG and create transient DXF
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch 0.13.4 https://github.com/LibreDWG/libredwg.git work/libredwg
          cd work/libredwg
          ./autogen.sh >/dev/null
          ./configure --disable-bindings --disable-docs --disable-write --prefix="$PWD/install" >/dev/null
          make -j2 >/dev/null
          make install >/dev/null
          BIN="$PWD/install/bin"
          "$BIN/dwg2dxf" --version | tee ../../toolmeta/libredwg.txt
          cd ../..

          for stem in bends3d cavigliatunnel cheopsshafts; do
            work/libredwg/install/bin/dwg2dxf -y -o "work/dxf/${stem}.dxf" "work/cad/${stem}.dwg"               >"report/diagnostics/${stem}.dwg2dxf.stdout.txt"               2>"report/diagnostics/${stem}.dwg2dxf.stderr.txt"
            test -s "work/dxf/${stem}.dxf"
          done

