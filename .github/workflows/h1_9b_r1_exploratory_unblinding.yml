name: H1.9B-R1 exploratory numerical target unblinding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/h1_9b_r1_exploratory_unblinding.yml

permissions:
  contents: read

concurrency:
  group: h1-9b-r1-exploratory-unblinding
  cancel-in-progress: false

jobs:
  execute-h1-9b-r1:
    name: Execute frozen 7-of-31 exploratory target unblinding
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SPK_BASE: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets
      LSK_BASE: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk
      P1: de441_part-1.bsp
      P2: de441_part-2.bsp
      LSK: naif0012.tls
      EXPECTED_MD5_P1: 7e5fcf9ecb5d08e1ab70c049baa60cd3
      EXPECTED_MD5_P2: ad8dfa4e505ef0e3a5d587a5b4705632
      EXPECTED_SCRIPT_SHA256: e072e0671eaae191a0a0b88bafa18ac1ac00467e4e552a3da4487f0d11a5afe2
      R0_PACKAGE_SHA256: bf9f8100d99e843074651e7b3f49466b4d85d5c9255f12fa291abdb76bd1dd74
      R1A_RUN_ID: '33249696632'
      R1A_ARTIFACT_ID: '9713965693'
      R1A_ARTIFACT_DIGEST: cc0eee8e44b970843c580e8230fad4243952e3e1554a576646b3c4f8dfbe1bbc

    steps:
      - name: Environment and stage firewall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen work output
          uname -a
          df -h
          python3 --version
          echo 'H1.9B-R1: real target exposure authorized only under frozen exploratory contract.'
          echo 'Synthetic rotations: FORBIDDEN. p_ROT|C: NOT COMPUTED. Significance: FORBIDDEN.'

      - name: Reconstruct exact frozen authority bytes and execution source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > frozen/target_package.json
          printf '%s' '' | base64 -d > frozen/h19a_contract.json
          printf '%s' '' | base64 -d > frozen/h19a_partition.json
          printf '%s' '' | base64 -d > frozen/h19a_matrix.json
          printf '%s' '' | base64 -d > frozen/execution_inputs.json
          printf '%s' '' | base64 -d > frozen/H1_9B_R1_execute.py
          chmod 0555 frozen/H1_9B_R1_execute.py
          sha256sum frozen/* | tee output/H1_9B_R1_embedded_authority_SHA256.txt
          test "$(sha256sum frozen/H1_9B_R1_execute.py | awk '{print $1}')" = "$EXPECTED_SCRIPT_SHA256"

      - name: Reverify official NAIF DE441 checksum metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 "$SPK_BASE/aa_checksums.txt" -o work/aa_checksums_spk.txt
          grep -E "^${EXPECTED_MD5_P1}[[:space:]]+${P1}$" work/aa_checksums_spk.txt
          grep -E "^${EXPECTED_MD5_P2}[[:space:]]+${P2}$" work/aa_checksums_spk.txt

      - name: Download frozen DE441 kernels and official LSK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 10 "$SPK_BASE/$P1" -o "work/$P1"
          curl --fail --location --retry 8 --retry-delay 10 "$SPK_BASE/$P2" -o "work/$P2"
          curl --fail --location --retry 5 --retry-delay 5 "$LSK_BASE/$LSK" -o "work/$LSK"
          ls -lh work/$P1 work/$P2 work/$LSK

      - name: Frozen kernel integrity gate
        shell: bash
        run: |
          set -euo pipefail
          md5sum work/$P1 work/$P2
          sha256sum work/$P1 work/$P2 work/$LSK | tee output/H1_9B_R1_kernel_SHA256.txt
          test "$(md5sum work/$P1 | awk '{print $1}')" = "$EXPECTED_MD5_P1"
          test "$(md5sum work/$P2 | awk '{print $1}')" = "$EXPECTED_MD5_P2"
          test "$(sha256sum work/$P1 | awk '{print $1}')" = "13757827f5db41b835a24bbd637488636ce79a8ca754062fed17844f7d5b618e"
          test "$(sha256sum work/$P2 | awk '{print $1}')" = "3abb17dae2d78dd34880377544aacb54892104a0d4462b322cb9f4454d4887f6"
          test "$(sha256sum work/$LSK | awk '{print $1}')" = "678e32bdb5a744117a467cd9601cd6b373f0e9bc9bbde1371d5eee39600a039b"

      - name: Install numerical execution dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy scipy spiceypy
          python3 - <<'PY'
          import numpy, scipy, spiceypy
          import spiceypy as spice
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          print('spiceypy', spiceypy.__version__)
          print('CSPICE', spice.tkvrsn('TOOLKIT'))
          PY

      - name: Execute H1.9B-R1 frozen exploratory numerical unblinding
        shell: bash
        run: |
          set -euo pipefail
          python3 frozen/H1_9B_R1_execute.py \
            --p1 work/$P1 \
            --p2 work/$P2 \
            --lsk work/$LSK \
            --target-package frozen/target_package.json \
            --h19a-contract frozen/h19a_contract.json \
            --h19a-partition frozen/h19a_partition.json \
            --h19a-matrix frozen/h19a_matrix.json \
            --execution-inputs frozen/execution_inputs.json \
            --output-dir output \
            | tee output/H1_9B_R1_execution.log

      - name: Bind GitHub execution provenance and hash outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          out=pathlib.Path('output')
          evidence={
            'repository':os.environ.get('GITHUB_REPOSITORY'),
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'head_sha':os.environ.get('GITHUB_SHA'),
            'workflow_ref':os.environ.get('GITHUB_WORKFLOW_REF'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'runner_arch':os.environ.get('RUNNER_ARCH'),
            'R0_package_sha256':os.environ.get('R0_PACKAGE_SHA256'),
            'R1a_run_id':os.environ.get('R1A_RUN_ID'),
            'R1a_artifact_id':os.environ.get('R1A_ARTIFACT_ID'),
            'R1a_artifact_digest_sha256':os.environ.get('R1A_ARTIFACT_DIGEST'),
            'synthetic_rotations_executed':0,
            'p_ROT_given_C':'NOT_COMPUTED',
            'significance':'FORBIDDEN'
          }
          (out/'V0_H1_9B_R1_GitHub_Execution_Evidence_v1.0_2026-08-29.json').write_text(json.dumps(evidence,indent=2,sort_keys=True),encoding='utf-8')
          PY
          if compgen -G 'output/*' > /dev/null; then
            find output -maxdepth 1 -type f ! -name 'V0_H1_9B_R1_Output_SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > output/V0_H1_9B_R1_Output_SHA256.txt
            cat output/V0_H1_9B_R1_Output_SHA256.txt
          fi

      - name: Upload H1.9B-R1 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1_9B_R1_exploratory_unblinding
          path: |
            output/
            frozen/execution_inputs.json
            frozen/H1_9B_R1_execute.py
            work/aa_checksums_spk.txt
          if-no-files-found: warn
          retention-days: 30
