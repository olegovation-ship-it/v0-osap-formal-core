name: V0 OSAP Gate 3 Cluster B WP6 Successor-Consumer Integration Corrective Layer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate3-cluster-b-wp2-post-merge-closeout.yml'
      - '.github/workflows/gate3-cluster-b-wp2.yml'
      - '.github/workflows/gate3-cluster-b-wp3-post-merge-closeout.yml'
      - '.github/workflows/gate3-cluster-b-wp3.yml'
      - '.github/workflows/gate3-cluster-b-wp5-post-merge-closeout.yml'
      - '.github/workflows/gate3-cluster-b-wp5-sync-helper-repair.yml'
      - '.github/workflows/gate3-cluster-b-wp5.yml'
      - '.github/workflows/gate3-cluster-b-wp6-post-merge-closeout.yml'
      - '.github/workflows/gate3-cluster-b-wp6-successor-consumer-integration-corrective-layer.yml'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_SUCCESSOR_CONSUMER_INTEGRATION_CORRECTIVE_LAYER_MANIFEST.json'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_SUCCESSOR_CONSUMER_INTEGRATION_CORRECTIVE_LAYER_SHA256SUMS.txt'
      - 'release/v1.4.0/tools/verify_wp6_successor_consumer_integration_corrective_layer.py'
      - 'tests/test_gate3_cluster_b_wp6_successor_consumer_integration_corrective_layer.py'
  push:
    branches: [v1.4.0-development, main]
    paths:
      - '.github/workflows/gate3-cluster-b-wp2-post-merge-closeout.yml'
      - '.github/workflows/gate3-cluster-b-wp2.yml'
      - '.github/workflows/gate3-cluster-b-wp3-post-merge-closeout.yml'
      - '.github/workflows/gate3-cluster-b-wp3.yml'
      - '.github/workflows/gate3-cluster-b-wp5-post-merge-closeout.yml'
      - '.github/workflows/gate3-cluster-b-wp5-sync-helper-repair.yml'
      - '.github/workflows/gate3-cluster-b-wp5.yml'
      - '.github/workflows/gate3-cluster-b-wp6-post-merge-closeout.yml'
      - '.github/workflows/gate3-cluster-b-wp6-successor-consumer-integration-corrective-layer.yml'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_SUCCESSOR_CONSUMER_INTEGRATION_CORRECTIVE_LAYER_MANIFEST.json'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_SUCCESSOR_CONSUMER_INTEGRATION_CORRECTIVE_LAYER_SHA256SUMS.txt'
      - 'release/v1.4.0/tools/verify_wp6_successor_consumer_integration_corrective_layer.py'
      - 'tests/test_gate3_cluster_b_wp6_successor_consumer_integration_corrective_layer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-consumer-integration-corrective-layer:
    runs-on: ubuntu-latest
    env:
      GIT_OPTIONAL_LOCKS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Python validation dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Verify exact surface, predecessor v0.2, and eight-workflow replay matrix
        run: >-
          python release/v1.4.0/tools/verify_wp6_successor_consumer_integration_corrective_layer.py
          --mode committed
          --verify-eight-workflow-matrix
      - name: Dedicated corrective-layer regression
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_gate3_cluster_b_wp6_successor_consumer_integration_corrective_layer.py
      - name: Whitespace and bounded corrective-surface integrity
        run: git diff --check e1b3928c0759e2ed61624dabf4cbc505982c379f...HEAD
