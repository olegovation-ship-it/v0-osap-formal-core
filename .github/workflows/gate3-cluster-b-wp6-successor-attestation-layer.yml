name: V0 OSAP Gate 3 Cluster B WP6 Successor-Attestation Layer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate3-cluster-b-wp6-successor-attestation-layer.yml'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_SUCCESSOR_ATTESTATION_LAYER_MANIFEST.json'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_SUCCESSOR_ATTESTATION_LAYER_SHA256SUMS.txt'
      - 'release/v1.4.0/tools/verify_wp6_successor_attestation_layer.py'
      - 'tests/test_gate3_cluster_b_wp6_successor_attestation_layer.py'
  push:
    branches: [v1.4.0-development, main]
    paths:
      - '.github/workflows/gate3-cluster-b-wp6-successor-attestation-layer.yml'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_SUCCESSOR_ATTESTATION_LAYER_MANIFEST.json'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_SUCCESSOR_ATTESTATION_LAYER_SHA256SUMS.txt'
      - 'release/v1.4.0/tools/verify_wp6_successor_attestation_layer.py'
      - 'tests/test_gate3_cluster_b_wp6_successor_attestation_layer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-attestation-layer:
    runs-on: ubuntu-latest
    env:
      GIT_OPTIONAL_LOCKS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Python validation dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Verify predecessor boundary, four-root derivation, and replay matrix
        run: >-
          python release/v1.4.0/tools/verify_wp6_four_root_corrective_layer.py
          --mode committed
          --replay-workflow successor-attestation
          --job replay-matrix
      - name: Dedicated successor-layer regression
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_gate3_cluster_b_wp6_successor_attestation_layer.py
      - name: Whitespace and bounded additive-surface integrity
        run: git diff --check be193bd3e3bf46b8235b2472f04a4aab41203493...HEAD
