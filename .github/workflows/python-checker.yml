name: Python checker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checker:
    # PR #33 is validated by the dedicated WP6 post-merge closeout workflow.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main' || github.event.pull_request.head.ref != 'v1.4.0-development' || github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: v0-osap-fc1 fixtures
