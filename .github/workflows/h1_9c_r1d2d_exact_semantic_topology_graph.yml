      - name: Execute coordinate-redacted semantic topology graph
        shell: bash
        run: |
          set -euo pipefail
          python3 work/code/mapping.py | tee report/R1d2d_execution_summary.txt
          test -s report/H1_9C_R1d2d_semantic_topology_graph.json
          jq -e '.mapping_verdict == "DEFER_TO_POSTRUN_READ_ONLY_12ID_AUDIT"' report/H1_9C_R1d2d_semantic_topology_graph.json >/dev/null
          jq -e '.firewall.shaft_vector_extraction == 0' report/H1_9C_R1d2d_semantic_topology_graph.json >/dev/null
          jq -e '.firewall.shaft_angle_derivation == 0' report/H1_9C_R1d2d_semantic_topology_graph.json >/dev/null
          jq -e '.firewall.target_access == false' report/H1_9C_R1d2d_semantic_topology_graph.json >/dev/null
          jq -e '.firewall.target_recomputation == 0' report/H1_9C_R1d2d_semantic_topology_graph.json >/dev/null
          jq -e '.meta_stop == true' report/H1_9C_R1d2d_semantic_topology_graph.json >/dev/null

      - name: Destructively remove geometry-bearing transient inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/cad work/dxf work/libredwg work/code
          if find report toolmeta -type f \( -name '*.dwg' -o -name '*.dxf' -o -name '*.dwf' -o -name '*.rar' \) | grep -q .; then
            echo "Geometry-bearing payload escaped redaction boundary"
            exit 1
          fi

      - name: Freeze output hashes and firewall declaration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > report/R1d2d_firewall.json <<'JSON'
          {
            "stage": "H1.9C-R1d2d",
            "shaft_vector_extraction": 0,
