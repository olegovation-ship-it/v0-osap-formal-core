      - name: Execute shaft-corridor surface-patch graph
        shell: bash
        run: |
          set -euo pipefail
          python3 work/code/corridor.py | tee report/R1d2e_execution_summary.txt
          test -s report/H1_9C_R1d2e_shaft_corridor_surface_patch_graph.json
          test -s report/glyph_pair_corridor_paths.jsonl
          jq -e '.mapping_verdict == "DEFER_TO_POSTRUN_READ_ONLY_12ID_AUDIT"' report/H1_9C_R1d2e_shaft_corridor_surface_patch_graph.json >/dev/null
          jq -e '.primary_tier == "CENTRAL"' report/H1_9C_R1d2e_shaft_corridor_surface_patch_graph.json >/dev/null
          jq -e '.firewall.shaft_vector_extraction == 0' report/H1_9C_R1d2e_shaft_corridor_surface_patch_graph.json >/dev/null
          jq -e '.firewall.shaft_angle_derivation == 0' report/H1_9C_R1d2e_shaft_corridor_surface_patch_graph.json >/dev/null
          jq -e '.firewall.target_access == false' report/H1_9C_R1d2e_shaft_corridor_surface_patch_graph.json >/dev/null
          jq -e '.firewall.target_recomputation == 0' report/H1_9C_R1d2e_shaft_corridor_surface_patch_graph.json >/dev/null
          jq -e '.meta_stop == true' report/H1_9C_R1d2e_shaft_corridor_surface_patch_graph.json >/dev/null

      - name: Remove all geometry-bearing transient inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/cad work/dxf work/libredwg work/code
          if find report toolmeta -type f \( -name '*.dwg' -o -name '*.dxf' -o -name '*.dwf' -o -name '*.rar' \) | grep -q .; then
            echo "Geometry-bearing payload escaped redaction boundary"
            exit 1
          fi

      - name: Freeze output hashes and firewall
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > report/R1d2e_firewall.json <<'JSON'
          {
            "stage": "H1.9C-R1d2e",
            "shaft_vector_extraction": 0,
            "shaft_angle_derivation": 0,
            "azimuth_or_inclination_derivation": 0,
            "raw_coordinate_payload_emitted": false,
            "target_access": false,
            "target_recomputation": 0,
            "auc_pi_synthetic_rotation_p_rot_significance": "NOT_EXECUTED",
            "L0_NU_V0_promotion": "NONE",
            "mapping_verdict": "DEFER_TO_POSTRUN_READ_ONLY_12ID_AUDIT",
            "meta_stop": true
          }
          JSON
          find report toolmeta -type f ! -name 'R1d2e_output_SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > report/R1d2e_output_SHA256.txt || true

      - name: Upload R1d2e corridor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1_9C_R1d2e_shaft_corridor_surface_patch_graph
          path: |
            report/
            toolmeta/
          if-no-files-found: error
          retention-days: 30
