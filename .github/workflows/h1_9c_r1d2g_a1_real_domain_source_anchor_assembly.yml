      - name: Execute R1d2g scientific evidence generation only when manually dispatched
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=work/code python3 work/code/runner.py | tee report/R1d2g_execution_summary.txt

      - name: Enforce C12-C18, a1 routing, and hard firewall
        shell: bash
        run: |
          set -euo pipefail
          J=report/H1_9C_R1d2g_source_anchor_backbone_assembly.json
          test -s "$J"
          jq -e '.stage=="H1.9C-R1d2g" and .meta_stop==true' "$J" >/dev/null
          jq -e '.C14a_transition_domain_completeness.status=="PASS"' "$J" >/dev/null
          jq -e '.registration_rails.retained_exactly==["FX","I"]' "$J" >/dev/null
          jq -e '.complete_source_admissible_mapping_candidate_enumeration.zero_candidate_global_claim==false' "$J" >/dev/null
          jq -e '.firewall.shaft_vector_extraction==0 and .firewall.target_or_CMB_access==false and .firewall.target_recomputation==0' "$J" >/dev/null
          jq -e 'all(.[]; (.C14b_FX|IN("PASS","NOT_REACHED_PREREQUISITE_UNRESOLVED","NOT_REACHED_RESOURCE_EXHAUSTION","FAIL_IMPLEMENTATION")) and (.C14b_I|IN("PASS","NOT_REACHED_PREREQUISITE_UNRESOLVED","NOT_REACHED_RESOURCE_EXHAUSTION","FAIL_IMPLEMENTATION")))' report/R1d2g_a1_C14_per_axis.json >/dev/null
          jq -e '.claim_critical_live_reacquisition==false and .live_transport_failure_invalidates_scientific_run==false' report/R1d2g_a1_source_transport.json >/dev/null
          test -s report/transition_domain_ledger.jsonl
          test -s report/transition_exclusion_ledger.jsonl
          test -s report/transition_completeness_certificate.json
          test -s report/chain_enumeration_completeness_certificate.json
          test -s report/R1d2g_a1_ID_specific_dependency_matrix.json
          test -s report/R1d2g_a1_rail_specific_family_backbone_propagation.json
          test -s report/R1d2g_a1_glyph_occurrence_ordinal_ledger.jsonl
          test -s report/R1d2g_a1_per_axis_solver_results.json
          test -s report/FX_I_invariance_ledger.json
          test -s report/execution_transport_equivalence_ledger.json
          find report toolmeta -type f -print0 | sort -z | xargs -0 sha256sum > report/R1d2g_output_SHA256.txt

      - name: Upload bounded R1d2g evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: H1_9C_R1d2g_a1_real_domain_source_anchor_assembly
          path: |
            report/
            toolmeta/
          if-no-files-found: error
          retention-days: 30
