      REAL_WIRING_SHA256: '2acc1aff612375175867aa5f3d9296fcb8936947b5628efe81cda775250f6744'
      R1D2G_RUNNER_SHA256: '366a69243990809dc9aa4b95f182616c965835f9254a0b4557e240fb51fc3ee3'
      R1D2G_SOLVER_MAX_STATES: '2000000'
      R1D2G_SOLVER_MAX_MAPPINGS: '250000'
      R1D2G_SOLVER_MAX_SECONDS: '600'

    steps:
      - name: Prepare deterministic workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/r1c upstream/r1d2a upstream/r1d2f work/cad work/dxf work/code report/glyphs report/diagnostics toolmeta
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip jq git build-essential autoconf automake libtool pkg-config libpcre2-dev libxml2-dev swig python3-dev gettext texinfo curl
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'ezdxf==1.4.4' 'Pillow==11.3.0' 'numpy==2.5.2'
          python3 - <<'PYMETA' > toolmeta/python_tools.txt
          import sys, ezdxf, PIL, numpy
          print('python', sys.version)
          print('ezdxf', ezdxf.__version__)
          print('Pillow', PIL.__version__)
          print('numpy', numpy.__version__)
          PYMETA

      - name: Download and verify frozen artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          for spec in "${R1C_ARTIFACT_ID}:r1c:${R1C_ARTIFACT_SHA256}" "${R1D2A_ARTIFACT_ID}:r1d2a:${R1D2A_ARTIFACT_SHA256}" "${R1D2F_ARTIFACT_ID}:r1d2f:${R1D2F_ARTIFACT_SHA256}"; do
            id="$(printf '%s' "$spec" | cut -d: -f1)"; tag="$(printf '%s' "$spec" | cut -d: -f2)"; expected="$(printf '%s' "$spec" | cut -d: -f3)"
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api/$id/zip" -o "upstream/$tag.zip"
            echo "$expected  upstream/$tag.zip" | sha256sum -c -
            unzip -q "upstream/$tag.zip" -d "upstream/$tag"
          done
          check() { local f="$1" e="$2"; echo "$e  $f" | sha256sum -c -; }
          check upstream/r1c/unpacked/bends3d/bends3d.dwg "$EXPECT_BENDS_DWG"
          check upstream/r1c/unpacked/cavigliatunnel/cavigliatunnel.dwg "$EXPECT_CAVIGLIA_DWG"
          check upstream/r1c/unpacked/cheopsshafts/cheopsshafts.dwg "$EXPECT_SHAFTS_DWG"
          check upstream/r1d2a/report/source_semantic_contract.json "$EXPECT_SOURCE_CONTRACT"
          check upstream/r1d2a/report/source_page_sha256.txt "$EXPECT_SOURCE_PAGE_SHA"
          check upstream/r1d2f/toolmeta/h1_9c_r1d2f_sparse_dual_rail_wall_pair_backbone.py "$PARENT_KERNEL_SHA256"
          jq -e '.stage=="H1.9C-R1d2f" and .primary_pair_tier=="CENTRAL" and (.cheops.backbone_summaries|length)==616' upstream/r1d2f/report/H1_9C_R1d2f_sparse_dual_rail_backbone.json >/dev/null
          jq -e '.bends3d_cheops_registration_dual_rail.status=="FINITE_SYMMETRY_CANDIDATES" and [.bends3d_cheops_registration_dual_rail.candidate_registrations[].symmetry]==["FX","I"]' upstream/r1d2f/report/H1_9C_R1d2f_sparse_dual_rail_backbone.json >/dev/null
          cp upstream/r1c/unpacked/bends3d/bends3d.dwg work/cad/bends3d.dwg
          cp upstream/r1c/unpacked/cavigliatunnel/cavigliatunnel.dwg work/cad/cavigliatunnel.dwg
          cp upstream/r1c/unpacked/cheopsshafts/cheopsshafts.dwg work/cad/cheopsshafts.dwg
          cp upstream/r1d2a/report/source_semantic_contract.json report/source_semantic_contract.json
          cp upstream/r1d2a/report/source_page_sha256.txt report/source_page_sha256.txt
          cp upstream/r1d2f/toolmeta/h1_9c_r1d2f_sparse_dual_rail_wall_pair_backbone.py work/code/r1d2f_parent.py
          echo 'LIVE_SOURCE_REACQUISITION=NOT_ATTEMPTED_NON_CLAIM_CRITICAL' > toolmeta/live_source_transport.txt

      - name: Build pinned LibreDWG 0.13.4 and create transient DXF
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch 0.13.4 https://github.com/LibreDWG/libredwg.git work/libredwg
          cd work/libredwg
          ./autogen.sh >/dev/null
          ./configure --disable-bindings --disable-docs --disable-write --prefix="$PWD/install" >/dev/null
          make -j2 >/dev/null
          make install >/dev/null
          "$PWD/install/bin/dwg2dxf" --version | tee ../../toolmeta/libredwg.txt
          cd ../..
          for stem in bends3d cavigliatunnel cheopsshafts; do
            work/libredwg/install/bin/dwg2dxf -y -o "work/dxf/${stem}.dxf" "work/cad/${stem}.dwg" >"report/diagnostics/${stem}.dwg2dxf.stdout.txt" 2>"report/diagnostics/${stem}.dwg2dxf.stderr.txt"
            test -s "work/dxf/${stem}.dxf"
          done

