name: V0 OSAP Gate 3 Cluster B WP6 Root D Successor-Attested Override

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate3-cluster-b-wp6-successor-consumer-integration-corrective-layer.yml'
      - '.github/workflows/gate3-cluster-b-wp6-root-d-successor-attested-override.yml'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_ROOT_D_SUCCESSOR_ATTESTED_OVERRIDE_MANIFEST.json'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_ROOT_D_SUCCESSOR_ATTESTED_OVERRIDE_SHA256SUMS.txt'
      - 'release/v1.4.0/tools/verify_wp6_root_d_successor_attested_override.py'
      - 'tests/test_gate3_cluster_b_wp6_root_d_successor_attested_override.py'
      - '.github/workflows/gate3-cluster-b-wp6-hosted-ci-predecessor-blob-fixture-closure.yml'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_HOSTED_CI_PREDECESSOR_BLOB_FIXTURE_CLOSURE_MANIFEST.json'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_HOSTED_CI_PREDECESSOR_BLOB_FIXTURE_CLOSURE_SHA256SUMS.txt'
      - 'release/v1.4.0/tools/verify_wp6_hosted_ci_predecessor_blob_fixture_closure.py'
      - 'tests/test_gate3_cluster_b_wp6_hosted_ci_predecessor_blob_fixture_closure.py'
  push:
    branches: [v1.4.0-development, main]
    paths:
      - '.github/workflows/gate3-cluster-b-wp6-successor-consumer-integration-corrective-layer.yml'
      - '.github/workflows/gate3-cluster-b-wp6-root-d-successor-attested-override.yml'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_ROOT_D_SUCCESSOR_ATTESTED_OVERRIDE_MANIFEST.json'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_ROOT_D_SUCCESSOR_ATTESTED_OVERRIDE_SHA256SUMS.txt'
      - 'release/v1.4.0/tools/verify_wp6_root_d_successor_attested_override.py'
      - 'tests/test_gate3_cluster_b_wp6_root_d_successor_attested_override.py'
      - '.github/workflows/gate3-cluster-b-wp6-hosted-ci-predecessor-blob-fixture-closure.yml'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_HOSTED_CI_PREDECESSOR_BLOB_FIXTURE_CLOSURE_MANIFEST.json'
      - 'release/v1.4.0/GATE3_CLUSTER_B_WP6_HOSTED_CI_PREDECESSOR_BLOB_FIXTURE_CLOSURE_SHA256SUMS.txt'
      - 'release/v1.4.0/tools/verify_wp6_hosted_ci_predecessor_blob_fixture_closure.py'
      - 'tests/test_gate3_cluster_b_wp6_hosted_ci_predecessor_blob_fixture_closure.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-d-successor-attested-override:
    runs-on: ubuntu-latest
    env:
      GIT_OPTIONAL_LOCKS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact validation and detached replay dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema pyyaml
      - name: Verify pull-request hosted-CI acceptance corrective layer and frozen replay
        run: >-
          python release/v1.4.0/tools/verify_wp6_pull_request_hosted_ci_acceptance_corrective_layer.py
          --mode committed
          --replay-workflow wp6-root-d
      - name: Dedicated pull-request hosted-CI acceptance regression
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_gate3_cluster_b_wp6_pull_request_hosted_ci_acceptance_corrective_layer.py
      - name: Whitespace and exact seven-path fixture-closure integrity
        run: git diff --check 466f820a313366c5f0bd4b23afaea44fe6fdc3b3...HEAD
